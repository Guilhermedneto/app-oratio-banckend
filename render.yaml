# Blueprint do Render (plano gratuito). Os segredos marcados com sync: false são informados no painel.
# Cron Jobs do Render são pagos: os jobs diários rodam pelo GitHub Actions (.github/workflows/jobs.yml).
services:
  - type: web
    name: oratio-api
    runtime: python
    plan: free
    buildCommand: pip install .
    # migrations no início: o plano gratuito não tem "pre-deploy command"
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - { key: PYTHON_VERSION, value: "3.12.7" }
      - { key: ENV, value: prod }
      - { key: DATABASE_URL, sync: false } # connection string COM pooler do Neon (…-pooler…), formato postgresql://…?sslmode=require
      - { key: JWT_SECRET, generateValue: true }
      - { key: CORS_ORIGINS, sync: false } # URL do front na Vercel, ex.: https://oratio.vercel.app
      - { key: MANAGER_EMAILS, sync: false } # e-mails que viram gestores (separados por vírgula)
      - { key: LITURGY_SOURCES, value: "railway" }
      - { key: GOOGLE_CLIENT_ID, sync: false } # opcional
      - { key: VAPID_PUBLIC_KEY, sync: false } # opcional (lembretes por push)
      - { key: VAPID_PRIVATE_KEY, sync: false }
      - { key: VAPID_SUBJECT, sync: false } # mailto:voce@exemplo.com
